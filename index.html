<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAVE｜个人工作台</title><style>html,body,iframe{margin:0;border:0;width:100%;height:100%}#toast{position:fixed;right:24px;bottom:24px;background:#172d55;color:#fff;padding:12px 16px;border-radius:10px;font:13px Arial,"PingFang SC";opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:none}</style></head><body><iframe id="app" src="WAVE-个人工作台.html" title="WAVE 个人工作台"></iframe><div id="toast"></div><script>const f=document.querySelector('#app'),t=document.querySelector('#toast');function say(m){t.textContent=m;t.className='show';clearTimeout(window.tt);window.tt=setTimeout(()=>t.className='',2200)}f.onload=()=>{const d=f.contentDocument;const nav=d.querySelectorAll('.nav button');['已切换到今日工作台','已打开我的任务','已打开日历计划','已打开笔记灵感'].forEach((m,i)=>nav[i].addEventListener('click',()=>{nav.forEach(x=>x.classList.remove('on'));nav[i].classList.add('on');say(m)}));d.querySelectorAll('.link').forEach((x,i)=>x.addEventListener('click',()=>say(['已新建一条空白笔记','已创建一个新的日程草稿','本周复盘模板已打开'][i])));d.querySelector('.smallcard').addEventListener('click',()=>say('本周专注度：比上周提升 18%'));d.querySelector('.profile').addEventListener('click',()=>say('个人工作空间设置已打开'));d.querySelector('.tools').addEventListener('click',()=>say('搜索、提醒与帮助已准备好'));d.querySelector('.quote').addEventListener('click',()=>say('已收藏今日微光'))}</script></body></html>
