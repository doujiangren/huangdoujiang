</style></head><body><main class="app"><aside class="side"><div class="brand"><span class="mark">W</span>WAVE</div><nav class="nav"><button class="on">⌂　今日工作台</button><button>✓　我的任务　6</button><button>▣　日历计划</button><button>◌　笔记灵感</button></nav><div class="smallcard">✦　<strong>本周专注度</strong><span>比上周提升 18%</span></div><div class="profile"><span class="avatar">林</span><div><b>林知夏</b><small>个人工作空间</small></div></div></aside><section class="main"><header class="bar">我的空间 <b>/</b> 今日 <span class="tools">⌕　♧　?</span></header><div class="wrap"><section class="intro"><div><p class="eyebrow">MONDAY, SEPTEMBER 16</p><h1>早上好，林知夏 <span>✦</span></h1><p class="sub">轻一点开始，今天也会很顺利。</p></div><button class="blue" id="focus">开始专注　→</button></section><section class="dates" id="dates"></section><div class="grid"><section class="panel"><div class="head"><div><p class="section">TODAY'S PLAN</p><h2>今天的待办 <span id="count">1/3</span></h2></div><button class="add" id="add">+ 添加任务</button></div><div id="tasks"></div><div class="prog"><div><span>今日进度</span><strong id="percent">33%</strong></div><div class="track"><div class="fill" id="fill"></div></div></div></section><aside class="right"><section class="panel"><div class="head"><div><p class="section">FOCUS</p><h2>专注时刻</h2></div><span>···</span></div><div class="timer"><div class="ring"><div class="inner"><strong id="time">25:00</strong><small id="state">准备开始</small></div></div></div><button class="timerbtn" id="timer">开始 25 分钟</button></section><section class="quote"><b>“</b><p>不要着急，所有认真投入的时光，都会在未来开花结果。</p><small>— 今日微光</small></section></aside></div><section class="quick"><div><p class="section">QUICK ACCESS</p><h2>常用入口</h2></div><div class="links"><button class="link"><span class="ico">▤</span><b>新建笔记</b><small>记录一闪而过的灵感</small></button><button class="link"><span class="ico">□</span><b>日程安排</b><small>为接下来留出时间</small></button><button class="link"><span class="ico">⌁</span><b>本周复盘</b><small>看见自己的进步</small></button></div></section></div></section></main><script>
const ds=[['一','15'],['二','16'],['三','17'],['四','18'],['五','19'],['六','20'],['日','21']],dates=document.querySelector('#dates');ds.forEach((d,i)=>{let b=document.createElement('button');b.className='date '+(i===1?'on':'');b.innerHTML='<small>'+d[0]+'</small><b>'+d[1]+'</b>';b.onclick=()=>{document.querySelectorAll('.date').forEach(x=>x.classList.remove('on'));b.classList.add('on')};dates.append(b)});let tasks=[['完成课程大纲初稿','14:00 前整理好三个模块',0,'重点'],['回复项目协作消息','确认本周交付范围',0,'沟通'],['整理研究资料','归档今天新增的 6 份文献',1,'整理']],box=document.querySelector('#tasks');function render(){box.innerHTML='';tasks.forEach((t,i)=>{let a=document.createElement('article');a.className='task '+(t[2]?'done':'');a.innerHTML='<button class="check">'+(t[2]?'✓':'')+'</button><div><h3>'+t[0]+'</h3><p>'+t[1]+'</p></div><span class="tag '+(t[3]==='重点'?'hot':'')+'">'+t[3]+'</span>';a.querySelector('.check').onclick=()=>{t[2]=!t[2];render()};box.append(a)});let n=tasks.filter(t=>t[2]).length,p=Math.round(n/tasks.length*100);document.querySelector('#count').textContent=n+'/'+tasks.length;document.querySelector('#percent').textContent=p+'%';document.querySelector('#fill').style.width=p+'%'}render();document.querySelector('#add').onclick=()=>{tasks.push(['一件新的待办','点击任务名称后可规划细节',0,'新增']);render()};let on=false;function f(){on=!on;document.querySelector('#focus').textContent=on?'结束专注':'开始专注　→';document.querySelector('#timer').textContent=on?'暂停一下':'开始 25 分钟';document.querySelector('#time').textContent=on?'24:58':'25:00';document.querySelector('#state').textContent=on?'正在专注':'准备开始'}document.querySelector('#focus').onclick=f;document.querySelector('#timer').onclick=f;
